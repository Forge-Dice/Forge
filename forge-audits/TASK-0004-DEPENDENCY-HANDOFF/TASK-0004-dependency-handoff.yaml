reconciliation_required:
  - Seb decides status of existing v1 contract (6a8c0c5) and implementation (e9cb8e2): supersede, keep, or revert. Developer must not implement until decided.
  - New contract must be versioned (contract_version 2, supersedes 6a8c0c5 blob) and name its base_commit explicitly (5bfa5a4 vs current branch HEAD be40a68).
  - Contract must explicitly forbid the public parseCaseSolution probe-oracle and requiredConclusions as truth source.
  - Contract must require runtime binding re-check (brand is type-only).
  - Contract must specify handle numbering/order rules (dense, emitted-only, author-order-independent, no origin encoding).
  - Contract must decide whether knowledge vs belief is distinguishable in NpcVisibleContext (factive-knowledge truth leak).
  - Contract must require awareness of every entity referenced by a conclusion/proposition claim before projecting it.
  - Import DeepReadonly from case-truth.ts; define own sha256-hex schema (TruthHashSchema is private).
